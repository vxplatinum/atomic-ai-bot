<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Static Site</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="wrapper">
        <header class="header">
            <a class="header__logo" href="/">Static Site</a>
        </header>
        <main class="main">
            <h1>This is an example of a Static Site.</h1>
        </main>
        <footer class="footer">
            <a class="header__logo" href="/">Static Site</a>
        </footer>
    </div>
    <!-- Live widget. api_key must belong to a bot whose allowed_domain is this origin (:5500). -->
    <script
  src="http://127.0.0.1:8080/static/js/widget.js"
  id="atomic-ai-bot"
  data-backend-url="http://127.0.0.1:8000"
  data-api-key="token_from_webapp"
  defer
></script>
</body>
</html>
